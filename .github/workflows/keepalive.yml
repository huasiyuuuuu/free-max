name: keepalive
# 免费 web service 15 分钟没入站流量就休眠 → 定时打 /healthz 把它按住。
# 750 实例小时/月的算术：24×7 的 31 天月 ≈ 744h，塞得进 750h（1 个服务）；2 个服务 24×7 ≈ 1488h，必爆。
# 注意：GitHub 免费档的 schedule 会被延迟（常见 5–20 分钟），仓库 60 天没活动会停掉这个 workflow。
# 更稳的替代：UptimeRobot 免费档 5 分钟间隔的 HTTP 监控，直接指到 https://<你的服务>.onrender.com/healthz
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping healthz
        run: |
          curl -fsS --max-time 25 --retry 2 "https://REPLACE-ME.onrender.com/healthz" | head -c 400
